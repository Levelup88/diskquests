<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DiskQuest Store - ขายแผ่นเกมมือ 1 และมือ 2</title>
  <style>
    :root{--bg:#0b1020;--card:#121a31;--muted:#94a3b8;--text:#e2e8f0;--brand:#22c55e;--brand2:#16a34a;--warn:#f59e0b}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:linear-gradient(180deg,#05070f,#0b1020);color:var(--text)}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    .hero{display:flex;justify-content:space-between;gap:18px;align-items:center;padding:26px;border:1px solid #1f2a44;border-radius:18px;background:#0f172a}
    .badge{background:#12331f;color:#86efac;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-block}
    h1{margin:12px 0 8px;font-size:34px} p{color:var(--muted)}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;margin-top:16px}
    .card{background:var(--card);border:1px solid #1f2a44;border-radius:16px;padding:14px}
    .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
    .type{padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700}
    .new{background:#164e63;color:#a5f3fc}.used{background:#3f2d09;color:#fde68a}
    .price{font-size:24px;font-weight:800;color:#86efac}
    .btn{background:var(--brand);color:#052e16;border:none;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}
    .btn:hover{background:var(--brand2)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
    input,select{background:#0b1227;border:1px solid #2a3555;color:var(--text);padding:10px;border-radius:10px}
    table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #233052;text-align:left}th{color:#86efac}
    .footer{margin-top:24px;color:#64748b;font-size:13px;text-align:center}
  </style>
</head>
<body>
  <div class="wrap">
    <section class="hero">
      <div>
        <span class="badge">ร้านขายแผ่นเกม</span>
        <h1>DiskQuest Store</h1>
        <p>เว็บแอปสำหรับธุรกิจขายแผ่นเกม <b>มือ 1</b> และ <b>มือ 2</b> พร้อมระบบค้นหา จัดการสต็อก และบันทึกยอดขาย</p>
      </div>
      <button class="btn" onclick="seedData()">เพิ่มสินค้าตัวอย่าง</button>
    </section>

    <div class="toolbar">
      <input id="search" placeholder="ค้นหาเกม เช่น FIFA, GTA, Zelda" oninput="renderProducts()" />
      <select id="filterType" onchange="renderProducts()">
        <option value="all">ทั้งหมด</option>
        <option value="มือ 1">มือ 1</option>
        <option value="มือ 2">มือ 2</option>
      </select>
      <button class="btn" onclick="openForm()">+ เพิ่มสินค้า</button>
    </div>

    <div id="productGrid" class="grid"></div>

    <h2>ประวัติการขายล่าสุด</h2>
    <div class="card">
      <table>
        <thead><tr><th>วันที่</th><th>สินค้า</th><th>ประเภท</th><th>ราคา</th><th>สถานะ</th></tr></thead>
        <tbody id="salesBody"></tbody>
      </table>
    </div>

    <p class="footer">© 2026 DiskQuest Store - ระบบบริหารร้านแผ่นเกม</p>
  </div>

  <script>
    const products = [
      { name:'Elden Ring', platform:'PS5', type:'มือ 1', price:1790, stock:5 },
      { name:'God of War Ragnarök', platform:'PS5', type:'มือ 2', price:1190, stock:2 },
      { name:'Mario Kart 8 Deluxe', platform:'Switch', type:'มือ 1', price:1590, stock:6 },
    ];
    const sales = [
      { date:'2026-05-01', item:'God of War Ragnarök', type:'มือ 2', price:1190, status:'ชำระแล้ว' },
      { date:'2026-05-01', item:'Elden Ring', type:'มือ 1', price:1790, status:'จัดส่งแล้ว' },
    ];

    function thb(n){ return new Intl.NumberFormat('th-TH').format(n)+' บาท'; }

    function renderProducts(){
      const q=document.getElementById('search').value.toLowerCase();
      const t=document.getElementById('filterType').value;
      const el=document.getElementById('productGrid');
      el.innerHTML='';
      products
        .filter(p=>(t==='all'||p.type===t) && (p.name.toLowerCase().includes(q)||p.platform.toLowerCase().includes(q)))
        .forEach(p=>{
          const card=document.createElement('div'); card.className='card';
          card.innerHTML=`<div class="row"><strong>${p.name}</strong><span class="type ${p.type==='มือ 1'?'new':'used'}">${p.type}</span></div>
            <p>${p.platform} • คงเหลือ ${p.stock} แผ่น</p>
            <div class="row"><span class="price">${thb(p.price)}</span><button class="btn" onclick="sell('${p.name.replace(/'/g,"\\'")}')">ขายสินค้า</button></div>`;
          el.appendChild(card);
        });
    }

    function renderSales(){
      const body=document.getElementById('salesBody'); body.innerHTML='';
      sales.forEach(s=>{
        const tr=document.createElement('tr');
        tr.innerHTML=`<td>${s.date}</td><td>${s.item}</td><td>${s.type}</td><td>${thb(s.price)}</td><td>${s.status}</td>`;
        body.appendChild(tr);
      });
    }

    function sell(name){
      const p=products.find(x=>x.name===name);
      if(!p || p.stock<=0){alert('สินค้าไม่พอในสต็อก');return;}
      p.stock-=1;
      sales.unshift({date:new Date().toISOString().slice(0,10),item:p.name,type:p.type,price:p.price,status:'ชำระแล้ว'});
      renderProducts(); renderSales();
    }

    function openForm(){
      const name=prompt('ชื่อเกม'); if(!name) return;
      const platform=prompt('แพลตฟอร์ม (PS5 / PS4 / Switch / Xbox)','PS5')||'PS5';
      const type=prompt('ประเภท (มือ 1 หรือ มือ 2)','มือ 1')||'มือ 1';
      const price=Number(prompt('ราคาขาย (บาท)','990')||0);
      const stock=Number(prompt('จำนวนสต็อก','1')||1);
      products.unshift({name,platform,type:type==='มือ 2'?'มือ 2':'มือ 1',price,stock});
      renderProducts();
    }

    function seedData(){
      products.push({ name:'FIFA 26', platform:'PS5', type:'มือ 1', price:1990, stock:4 });
      products.push({ name:'GTA V', platform:'PS4', type:'มือ 2', price:590, stock:3 });
      renderProducts();
    }

    renderProducts(); renderSales();
  </script>
</body>
</html>
